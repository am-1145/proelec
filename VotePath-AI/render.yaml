services:
  - type: web
    name: votepath-ai-backend
    env: node
    rootDir: VotePath-AI/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
      - key: JWT_SECRET
      - key: GEMINI_API_KEY
      - key: MISTRAL_API_KEY
      - key: GOOGLE_TRANSLATE_API_KEY
      - key: FIREBASE_PROJECT_ID
